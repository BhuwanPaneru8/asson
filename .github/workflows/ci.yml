name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: asson
          POSTGRES_PASSWORD: asson
          POSTGRES_DB: asson_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U asson" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://asson:asson@localhost:5432/asson_test?schema=public
      TEST_DATABASE_URL: postgresql://asson:asson@localhost:5432/asson_test?schema=public
      E2E_DATABASE_URL: postgresql://asson:asson@localhost:5432/asson_e2e?schema=public
      AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-00
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Create E2E database
        run: PGPASSWORD=asson psql -h localhost -U asson -d asson_test -c "CREATE DATABASE asson_e2e"
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests
        run: npm run test:int
      - name: Deploy script (blue/green, zero failed requests)
        run: bash tests/deploy/release.test.sh
      - name: Production build
        run: npx next build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
